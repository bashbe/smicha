<div class="glass-card player-card" dir="rtl">
  <div class="card-meta card-meta-editable">
    <span id="admin-card-parcours-subject"></span><span> · Siman </span><input type="number" name="siman" min="1" class="card-meta-input" value="{{ selected.siman if selected.siman is not none else '' }}" /><span> · Seif </span><input type="number" name="seif" min="1" class="card-meta-input" value="{{ selected.seif if selected.seif is not none else '' }}" />
  </div>
  <div class="card-tags" id="admin-card-tags">{% for t in (selected.tags or []) %}<span class="card-tag card-tag-editable" data-tag="{{ t }}">{{ t }}<button type="button" class="card-tag-remove" onclick="removeTag(this)">×</button></span>{% endfor %}<input type="text" id="admin-tag-input" class="card-tag-input" placeholder="+ tag" /></div>
  <input type="hidden" name="tags" id="admin-tags-hidden" value="{{ (selected.tags or []) | join(',') }}" />

  <div class="type-block stack-sm" data-type="multiple_choice">
    <textarea name="question_text" class="question-prompt-input" rows="3" placeholder="Question text">{{ payload.get('question_text') or '' }}</textarea>
    <div class="row between" style="margin-top:var(--space-2)"><label class="text-xs muted">Answers — select every correct answer</label><button type="button" class="admin-btn" onclick="addOption()">Add answer</button></div>
    <div id="options" class="stack-sm">{% for o in options_list %}<div class="choice option-row{{ ' is-correct' if o.get('is_correct') }}"><input type="checkbox" class="option-correct-checkbox" style="width:1.1rem;height:1.1rem" {{ 'checked' if o.get('is_correct') }} /><textarea name="option_text" rows="1" class="flex-1 choice-text-input auto-grow" placeholder="Answer {{ loop.index }}">{{ o.get('text','') }}</textarea><span class="key">{{ loop.index }}</span><button type="button" class="admin-btn" onclick="this.closest('.option-row').remove()">Remove</button></div>{% endfor %}</div>
    <input type="hidden" name="correct_options" id="correct_options_hidden" value="" />
  </div>

  <div class="type-block stack-sm" data-type="multiple_opinions_dropdown" style="display:none">
    <textarea name="question_text_op" class="question-prompt-input" rows="3" placeholder="Question text">{{ payload.get('question_text') or '' }}</textarea>
    <div class="row between"><label class="text-xs muted">Dropdown choices</label><button type="button" class="admin-btn" onclick="addChoice()">Add choice</button></div>
    <div id="choices">{% for c in payload.get('dropdown_choices') or ['',''] %}<div class="row gap-2 opinions-field-row"><textarea name="dropdown_choice" rows="1" class="flex-1 auto-grow">{{ c }}</textarea><button type="button" class="admin-btn" onclick="this.parentNode.remove()">Remove</button></div>{% endfor %}</div>
    <div class="row between"><label class="text-xs muted">Authorities and correct positions</label><button type="button" class="admin-btn" onclick="addDecisor()">Add authority</button></div>
    <div id="decisors">{% for d in payload.get('decisors') or [] %}<div class="decisor-row"><div class="row between decisor-row-head"><input name="decisor_id" value="{{ d.id }}" placeholder="ID" class="decisor-id-input" /><button type="button" class="admin-btn" onclick="this.closest('.decisor-row').remove()">Remove</button></div><textarea name="decisor_name" rows="1" class="auto-grow" placeholder="Authority name">{{ d.name }}</textarea><textarea name="decisor_correct" rows="1" class="auto-grow" placeholder="Correct position">{{ d.correct_choice }}</textarea></div>{% endfor %}</div>
  </div>

  <div class="type-block stack-sm" data-type="true_false" style="display:none">
    <textarea name="statement_text" class="question-prompt-input" rows="3" placeholder="Statement">{{ payload.get('statement_text') or '' }}</textarea>
    <div class="choice-grid"><label class="choice choice-tf{{ ' is-correct' if payload.get('correct_answer') != false }}"><input type="radio" name="correct_answer" value="true" {{ 'checked' if payload.get('correct_answer') != false }} /><strong>True</strong></label><label class="choice choice-tf{{ ' is-correct' if payload.get('correct_answer') == false }}"><input type="radio" name="correct_answer" value="false" {{ 'checked' if payload.get('correct_answer') == false }} /><strong>False</strong></label></div>
  </div>
  <div style="margin-top:var(--space-3);border-top:1px solid var(--border);padding-top:var(--space-2)"><label>Explanation</label><textarea name="explanation" rows="3" required>{{ payload.get('explanation') or selected.explanation or '' }}</textarea></div>
</div>
