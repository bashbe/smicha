{% extends "base.html" %}
{% block title %}כניסה — קניין הלכה{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-shell">

    <a href="{{ url_for('auth.index') }}" class="auth-back">
      → דף הבית
    </a>

    {% include "_flash.html" %}

    <div class="auth-card">
      <h1 id="title" class="auth-title">כניסה לאפליקציה</h1>
      <p id="subtitle" class="auth-subtitle">ברוך הבא חזרה</p>

      <form method="post" class="stack-sm">
        <input type="hidden" name="mode" id="mode" value="login" />

        <div id="name-field" class="hidden">
          <label for="name">שם מלא</label>
          <input id="name" name="name" dir="rtl" placeholder="ישראל ישראלי" />
        </div>
        <div>
          <label for="email">דוא"ל</label>
          <input id="email" name="email" type="email" required dir="ltr" placeholder="you@example.com" />
        </div>
        <div>
          <label for="password">סיסמה</label>
          <input id="password" name="password" type="password" required dir="ltr" minlength="6" placeholder="••••••" />
        </div>
        <label class="auth-remember">
          <input type="checkbox" name="remember" />
          הישאר מחובר
        </label>
        <button type="submit" class="btn btn-primary btn-block btn-lg auth-submit" id="submit-btn">כניסה</button>
      </form>

      <button type="button" id="toggle" class="auth-toggle">
        אין לך חשבון? <span class="auth-toggle-accent">הרשמה</span>
      </button>
    </div>

  </div>
</div>

<script>
  let mode = "login";
  const t = document.getElementById("toggle");
  t.addEventListener("click", () => {
    mode = mode === "login" ? "signup" : "login";
    document.getElementById("mode").value = mode;
    const signup = mode === "signup";
    document.getElementById("name-field").classList.toggle("hidden", !signup);
    document.getElementById("title").textContent = signup ? "הרשמה חדשה" : "כניסה לאפליקציה";
    document.getElementById("subtitle").textContent = signup ? "צור חשבון להתחיל ללמוד" : "ברוך הבא חזרה";
    document.getElementById("submit-btn").textContent = signup ? "הרשמה" : "כניסה";
    t.innerHTML = signup
      ? 'כבר יש לי חשבון? <span class="auth-toggle-accent">כניסה</span>'
      : 'אין לך חשבון? <span class="auth-toggle-accent">הרשמה</span>';
  });
</script>
{% endblock %}
