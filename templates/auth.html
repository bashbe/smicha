{% extends "base.html" %}
{% block title %}כניסה — סמיכה{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-2);">
  <div style="width:100%;max-width:360px;">

    <a href="{{ url_for('auth.index') }}"
       style="font-size:var(--text-sm);color:var(--muted);display:inline-flex;align-items:center;gap:4px;margin-bottom:var(--space-3);">
      → דף הבית
    </a>

    {% include "_flash.html" %}

    <h1 id="title" style="margin-bottom:0.25rem;">כניסה לאפליקציה</h1>
    <p id="subtitle" style="font-size:var(--text-sm);color:var(--muted);margin:0 0 var(--space-3);">ברוך הבא חזרה</p>

    <form method="post" class="stack-sm">
      <input type="hidden" name="mode" id="mode" value="login" />

      <div id="name-field" class="hidden">
        <label for="name">שם מלא</label>
        <input id="name" name="name" dir="rtl" placeholder="ישראל ישראלי" />
      </div>
      <div>
        <label for="email">דוא"ל</label>
        <input id="email" name="email" type="email" required dir="ltr" placeholder="you@example.com" />
      </div>
      <div>
        <label for="password">סיסמה</label>
        <input id="password" name="password" type="password" required dir="ltr" minlength="6" placeholder="••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn" style="margin-top:var(--space-3);">כניסה</button>
    </form>

    <button type="button" id="toggle"
            style="width:100%;margin-top:var(--space-3);background:none;border:none;color:var(--muted);font-size:var(--text-sm);cursor:pointer;padding:var(--space-1);font-family:inherit;">
      אין לך חשבון? <span style="color:var(--accent);font-weight:600;">הרשמה</span>
    </button>

  </div>
</div>

<script>
  let mode = "login";
  const t = document.getElementById("toggle");
  t.addEventListener("click", () => {
    mode = mode === "login" ? "signup" : "login";
    document.getElementById("mode").value = mode;
    const signup = mode === "signup";
    document.getElementById("name-field").classList.toggle("hidden", !signup);
    document.getElementById("title").textContent = signup ? "הרשמה חדשה" : "כניסה לאפליקציה";
    document.getElementById("subtitle").textContent = signup ? "צור חשבון להתחיל ללמוד" : "ברוך הבא חזרה";
    document.getElementById("submit-btn").textContent = signup ? "הרשמה" : "כניסה";
    t.innerHTML = signup
      ? 'כבר יש לי חשבון? <span style="color:var(--accent);font-weight:600;">כניסה</span>'
      : 'אין לך חשבון? <span style="color:var(--accent);font-weight:600;">הרשמה</span>';
  });
</script>
{% endblock %}
