{% extends "base.html" %}
{% block title %}סמיכה — הכנה לבחינת הסמיכה{% endblock %}

{% block body %}
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-3) var(--space-2);">
  <div style="width:100%;max-width:360px;text-align:center;">

    <h1 style="font-size:var(--text-4xl);">סמיכה</h1>
    <p style="color:var(--muted);margin:var(--space-1) 0 var(--space-4);">
      לימוד יורה דעה בקצב שלך, עם חזרה בדיוק כשצריך.
    </p>

    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg btn-block">
      התחל ללמוד
    </a>
    <a href="{{ url_for('admin.login') }}"
       style="display:block;font-size:var(--text-sm);color:var(--muted);text-align:center;padding:var(--space-1);margin-top:var(--space-1);">
      כניסת מנהל ←
    </a>

    <div style="display:flex;justify-content:center;gap:var(--space-3);margin-top:var(--space-5);padding-top:var(--space-3);border-top:1px solid var(--border);">
      <div>
        <div style="font-family:'Secular One',sans-serif;font-size:var(--text-xl);">523</div>
        <div style="font-size:var(--text-sm);color:var(--muted);">שאלות</div>
      </div>
      <div class="divider-v" style="height:auto;"></div>
      <div>
        <div style="font-family:'Secular One',sans-serif;font-size:var(--text-xl);">FSRS</div>
        <div style="font-size:var(--text-sm);color:var(--muted);">חזרה חכמה</div>
      </div>
      <div class="divider-v" style="height:auto;"></div>
      <div>
        <div style="font-family:'Secular One',sans-serif;font-size:var(--text-xl);">∞</div>
        <div style="font-size:var(--text-sm);color:var(--muted);">חזרות</div>
      </div>
    </div>

  </div>
</div>
{% endblock %}
