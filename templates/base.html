<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}קניין הלכה — הכנה לבחינה{% endblock %}</title>
  <script>
    // Mode sombre désactivé temporairement (bloqué sur demande) : on ignore la préférence
    // stockée tant que le bouton de bascule (templates/student/profil.html) reste retiré.
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Noto+Sans+Hebrew:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <meta name="theme-color" content="#0D1117" />
  <script>
    // La hauteur CSS "100vh" ne correspond pas à la hauteur réellement visible sur
    // mobile (barre d'adresse/clavier) : on recalcule --vh en JS (source de vérité,
    // window.innerHeight) sur toutes les pages, pour que les mises en page qui doivent
    // tenir dans un seul écran (calc(var(--vh, 1vh) * 100)) ne provoquent pas de
    // scroll superflu.
    (function () {
      function setViewportHeight() {
        document.documentElement.style.setProperty("--vh", window.innerHeight * 0.01 + "px");
      }
      setViewportHeight();
      window.addEventListener("resize", setViewportHeight);
      window.addEventListener("orientationchange", setViewportHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", setViewportHeight);
      }
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <div id="sw-update-banner" class="sw-update-banner" hidden>
    <span id="sw-update-text">גרסה חדשה זמינה</span>
    <button type="button" id="sw-update-btn">רענן</button>
  </div>
  <script>
    (function () {
      if (!("serviceWorker" in navigator)) return;

      var banner = document.getElementById("sw-update-banner");
      var text = document.getElementById("sw-update-text");
      var refreshButton = document.getElementById("sw-update-btn");
      var waitingWorker = null;
      var reloading = false;

      function showAvailable(worker) {
        waitingWorker = worker;
        text.textContent = "גרסה חדשה זמינה";
        refreshButton.hidden = false;
        banner.hidden = false;
      }

      function reloadNow() {
        if (reloading) return;
        reloading = true;
        try { sessionStorage.setItem("smiha-update-success", "1"); } catch (e) {}
        location.reload();
      }

      // Une mise à jour a pu être installée pendant que l'utilisateur était sur une autre
      // page (navigation classique, pas de SPA) : "updatefound" ne se redéclenche pas dans ce
      // cas, donc on vérifie aussi l'état déjà présent au chargement de CETTE page.
      navigator.serviceWorker.register("/sw.js").then(function (registration) {
        if (registration.waiting && navigator.serviceWorker.controller) {
          showAvailable(registration.waiting);
        }

        registration.addEventListener("updatefound", function () {
          var newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener("statechange", function () {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              showAvailable(newWorker);
            }
          });
        });

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") registration.update();
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", reloadNow);

      refreshButton.addEventListener("click", function () {
        refreshButton.disabled = true;
        refreshButton.textContent = "מרענן…";
        text.textContent = "מתקין את הגרסה החדשה…";
        if (waitingWorker) {
          waitingWorker.postMessage({ type: "SKIP_WAITING" });
        } else {
          reloadNow();
        }
        // Filet de sécurité : si "controllerchange" ne se déclenche pas (référence au worker
        // périmée après une navigation, aléa navigateur…), on recharge quand même après un délai
        // raisonnable pour que le bouton ne reste jamais bloqué en état "chargement".
        setTimeout(reloadNow, 4000);
      });

      // Après un rechargement déclenché par ce flux : bandeau de confirmation, auto-masqué.
      try {
        if (sessionStorage.getItem("smiha-update-success") === "1") {
          sessionStorage.removeItem("smiha-update-success");
          refreshButton.hidden = true;
          text.textContent = "העדכון הותקן בהצלחה ✓";
          banner.hidden = false;
          setTimeout(function () { banner.hidden = true; }, 3000);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
